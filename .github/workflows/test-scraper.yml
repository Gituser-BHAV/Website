name: Test Job Scraper

on:
  schedule:
    - cron: "0 * * * *"  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python scraper.py

      - name: Check generated file
        run: |
          echo "Checking jobs.json..."
          ls -lh jobs.json
          echo ""
          echo "Number of jobs:"
          python -c "import json; d=json.load(open('jobs.json')); print(len(d.get('jobs', [])))"

      - name: Commit jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobs.json

          if git diff --cached --quiet; then
            echo "No changes to jobs.json"
          else
            git commit -m "Update job data"
            git push
          fi
